## RegLoop AI — Render deployment config
## Deploy in one click: https://render.com/deploy
## Both services share the same repo root.

services:
  # ── Backend API (FastAPI) ───────────────────────────────────────────────────
  - type: web
    name: regloop-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # ← paste your key in the Render dashboard
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./regloop.db
    healthCheckPath: /api/health

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────
  - type: web
    name: regloop-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: regloop-backend
          type: web
          property: hostport
